name: daily-publish

on:
  workflow_dispatch:
  # AC-14 witnessed 2026-08-19 (run 32267564652); AC-16 idempotent exit
  # (run 32268278258). First cron run doubles as AC-07 rotation witness.
  schedule:
    - cron: "0 7 * * *"

# Shared with publish-now.yml — see the note there (DA token rotation).
concurrency:
  group: daily-publish
  cancel-in-progress: false

# The caller sets the ceiling: a called workflow cannot escalate beyond it,
# and the pipeline commits ledger transitions mid-run.
permissions:
  contents: write

jobs:
  # No `with:` on purpose: the scheduled path passes no overrides.
  publish:
    uses: ./.github/workflows/_pipeline.yml
    secrets: inherit
