name: publish-now

# Manual counterpart to daily-publish. Running it publishes — that is the
# whole point of the button. `model` and `date` are capabilities, not
# guards.
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Pin one roster model, or random"
        type: choice
        default: random
        options:
          - random
          - flux-2-flex
          - grok
          - nano-banana-2
          - recraft
          - z-image
      date:
        description: "ISO date override (empty = today UTC)"
        type: string
        default: ""

# MUST match daily.yml: overlapping runs both refresh the DA token, which
# rotates on every use — the second run would authenticate with a token the
# first already invalidated while the secret write races.
concurrency:
  group: daily-publish
  cancel-in-progress: false

# The caller sets the ceiling: a called workflow cannot escalate beyond it,
# and the pipeline commits ledger transitions mid-run.
permissions:
  contents: write

jobs:
  run:
    uses: ./.github/workflows/_pipeline.yml
    secrets: inherit
    with:
      model: ${{ inputs.model }}
      date: ${{ inputs.date }}
