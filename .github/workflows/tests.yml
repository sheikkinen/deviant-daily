name: tests

# FR-867 R-4: this is DETECTION, not blocking. The repo has no branch
# protection and no required status contexts, so a red run reports but
# does not stop a push. Local pre-commit is what blocks.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  suite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pillow
      - run: ruff check tools tests
      - run: python -m pytest tests/ -q
      - name: Requirement traceability
        run: python scripts/req_coverage.py --strict
