name: _pipeline

# Reusable body for both callers. Neither caller duplicates the secrets
# list or the install line; drift between them is a test failure
# (tests/test_workflows.py).
on:
  workflow_call:
    inputs:
      model:
        type: string
        default: ""
      date:
        type: string
        default: ""

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yamlgraph replicate httpx requests pyyaml pillow
      # git identity BEFORE the run: ledger transitions commit mid-pipeline
      - run: |
          git config user.name "deviant-daily-bot"
          git config user.email "actions@github.com"
      - name: Run pipeline (yamlgraph orchestrates; FR-826 R-1)
        run: |
          yamlgraph graph run graph.yaml \
            --var date="${DATE:-$(date -u +%F)}" \
            --var model="$MODEL" \
            --full
        env:
          DATE: ${{ inputs.date }}
          MODEL: ${{ inputs.model }}
          REPLICATE_API_TOKEN: ${{ secrets.REPLICATE_API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DA_CLIENT_ID: ${{ secrets.DA_CLIENT_ID }}
          DA_CLIENT_SECRET: ${{ secrets.DA_CLIENT_SECRET }}
          DA_REFRESH_TOKEN: ${{ secrets.DA_REFRESH_TOKEN }}
          GH_PAT: ${{ secrets.GH_PAT }}
          PROVIDER: anthropic
